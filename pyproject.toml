[project]
name = "coffe-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"
markers = [
    "integration: tests that exercise multiple application components",
]

[tool.coverage.run]
source = [
    "src.Catalogo.Bebida",
    "src.Catalogo.CatalogoBebidas",
    "src.DTO.ItemDTO",
    "src.DTO.PedidoDTO",
    "src.Estoque.Estoque",
    "src.Estoque.ProdutoEstoque",
    "src.routes.produtos",
    "src.services.Credito",
    "src.services.Pedido",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
